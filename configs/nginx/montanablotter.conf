# Nginx vhost for montanablotter.com
# Symlink from /etc/nginx/sites-available/montanablotter.com to enable.
# Synced with live /etc/nginx/sites-enabled/montanablotter on 2026-07-18.

server {
    server_name montanablotter.com;

    # Browsers request /favicon.ico by convention; serve the PWA icon there.
    location = /favicon.ico {
        alias /root/montanablotter/static/icons/icon-192.png;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Static assets served straight from disk. URLs carrying the deploy
    # cache-bust (?v=...) are fingerprinted and can be cached for a year;
    # unversioned assets get a day so deploys propagate quickly.
    location /static/ {
        alias /root/montanablotter/static/;
        add_header Cache-Control "public, max-age=86400";
        if ($arg_v != "") {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Agent monitoring bootstrap
    location = /api/monitoring/agents/bootstrap {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent monitoring events
    location = /api/monitoring/agents/events {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent WebSocket
    location /ws/agents {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Hermes Workspace
    location /hermes/ {
        proxy_pass http://127.0.0.1:9119/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:9119;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /hermes;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Studio access login form (sets the studio_access cookie).
    location = /admin/office/login {
        alias /root/claw3d-office/public/studio-login.html;
        default_type text/html;
    }

    # 3D Office (claw3d) — Next.js custom server on :3010.
    # /admin/office/... is stripped of the prefix and forwarded to /.
    location /admin/office/ {
        proxy_pass http://127.0.0.1:3010/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Next.js build assets for the office. The /admin/office/ block strips
    # its prefix, so static asset requests (/_next/static/...) never match it
    # and fall through to Flask, which 404s. Serve them directly from :3010.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010/_next/static/;
        proxy_set_header Host 127.0.0.1:3010;
    }

    # 3D office runtime API + assets. The /admin/office/ block strips the
    # /admin/office/ prefix, so every path the React app fetches at runtime
    # (none of which start with /admin/office/) needs its own proxy rule.
    # Confirmed non-overlapping with Flask /api/ namespaces (Flask has
    # /api/meetings, /api/push, /api/sex-offenders, /api/embed, /api/v1,
    # /api/monitoring; Next.js has /api/office, /api/studio, /api/task-store,
    # /api/files, /api/gateway, /api/runtime, /api/health, /api/path-suggestions).
    location = /api/studio {
        proxy_pass http://127.0.0.1:3010/api/studio;
        proxy_set_header Host 127.0.0.1:3010;
    }
    location = /api/task-store {
        proxy_pass http://127.0.0.1:3010/api/task-store;
        proxy_set_header Host 127.0.0.1:3010;
    }
    # Bare /api/office (no trailing slash) is used by OfficeBuilderPanel
    # for PUT layout updates; prefix match also covers /api/office/anything.
    location /api/office {
        proxy_pass http://127.0.0.1:3010/api/office;
        proxy_set_header Host 127.0.0.1:3010;
    }
    location /api/files/ {
        proxy_pass http://127.0.0.1:3010/api/files/;
        proxy_set_header Host 127.0.0.1:3010;
    }
    # Non-WS gateway routes (agent-state, skills/remove, media).
    # WS endpoint /api/gateway/ws is handled by a separate exact block below.
    location /api/gateway/ {
        proxy_pass http://127.0.0.1:3010/api/gateway/;
        proxy_set_header Host 127.0.0.1:3010;
    }
    location /api/runtime/ {
        proxy_pass http://127.0.0.1:3010/api/runtime/;
        proxy_set_header Host 127.0.0.1:3010;
    }
    location = /api/health {
        proxy_pass http://127.0.0.1:3010/api/health;
        proxy_set_header Host 127.0.0.1:3010;
    }
    location = /api/path-suggestions {
        proxy_pass http://127.0.0.1:3010/api/path-suggestions;
        proxy_set_header Host 127.0.0.1:3010;
    }

    # 3D model assets served by Next.js (Phaser/Three.js GLB files).
    location /office-assets/ {
        proxy_pass http://127.0.0.1:3010/office-assets/;
        proxy_set_header Host 127.0.0.1:3010;
    }

    # Same-origin WebSocket endpoint the office browser connects to.
    # The custom Node server then proxies this to the demo gateway (:18790).
    location = /api/gateway/ws {
        proxy_pass http://127.0.0.1:3010/api/gateway/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:3010;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Blotter Host fleet control plane, unified under /admin/fleet/
    location /admin/fleet/ {
        proxy_pass http://127.0.0.1:3000/admin/fleet/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Internal-Admin-Bypass 1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location = /admin/fleet {
        return 301 /admin/fleet/;
    }

    # Kimi Code local dashboard, exposed via nginx for remote access.
    # Path-based proxy; sub_filter rewrites root-relative asset URLs so the
    # React app loads under /kimi/ instead of the domain root.
    location /kimi/ {
        auth_basic "Kimi Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd-kimi;
        proxy_pass http://127.0.0.1:58627/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:58627;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /kimi;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'href="/' 'href="/kimi/';
        sub_filter 'src="/' 'src="/kimi/';
    }

    # Everything else — proxy to Flask app
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/montanablotter.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/montanablotter.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # Canonical host is the apex — fold www (https) into it.
    listen 443 ssl;
    server_name www.montanablotter.com;
    ssl_certificate /etc/letsencrypt/live/montanablotter.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/montanablotter.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    return 301 https://montanablotter.com$request_uri;
}

server {
    if ($host = www.montanablotter.com) {
        return 301 https://montanablotter.com$request_uri;
    }

    if ($host = montanablotter.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name montanablotter.com www.montanablotter.com;
    return 404;
}
