# Nginx vhost for montanablotter.com
# Symlink from /etc/nginx/sites-available/montanablotter.com to enable.

server {
    listen 80;
    server_name montanablotter.com www.montanablotter.com;

    root /root/montanablotter;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets — long cache because filenames are stable.
    location /static {
        alias /root/montanablotter/static;
        expires 1M;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Uploaded files — images/PDFs are immutable once written.
    location /uploads {
        alias /root/montanablotter/uploads;
        expires 1M;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }
}
