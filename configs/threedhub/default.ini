# PrusaSlicer config — headless slicing defaults.
# The dispatch agent passes a different .ini per printer/material combo;
# this one is the fallback when no specific profile is requested.
#
# IMPORTANT: PrusaSlicer's CLI requires settings in the right section
# (`[print:*]`, `[filament:*]`, `[printer:*]`). A flat dump of all keys
# silently drops any key in the wrong section, which is why the [g]
# filament stat was 0 in the first iteration.

[print:*]
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 20%
fill_pattern = gyroid
nozzle_diameter = 0.4
extrusion_multiplier = 1.0
temperature = 210
bed_temperature = 60
print_speed = 60
travel_speed = 150
retract_length = 0.8
support_material = 0
print_stats = 1

[filament:*]
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 25
fan_always_on = 1
cooling = 1
filament_stats = 1

[printer:*]
printer_technology = FFF
nozzle_diameter = 0.4
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 12
machine_max_acceleration_x = 1500
machine_max_acceleration_y = 1500
machine_max_acceleration_z = 200
machine_max_acceleration_e = 10000
machine_min_travel_x = 0
machine_min_travel_y = 0
machine_min_travel_z = 0
machine_bed_size = 220,220,250
machine_max_jerk_x = 10
machine_max_jerk_y = 10
machine_max_jerk_z = 0.4
machine_max_jerk_e = 5
printer_notes = 3D Hub default — Ender 3 sized

[admin:*]
filament_notes = PLA 1.75mm
