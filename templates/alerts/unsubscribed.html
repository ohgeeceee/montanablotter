{% extends "public_page_base.html" %}
{% set page_title = "Unsubscribed from Alerts" %}
{% block content %}
<div class="public-section public-section--narrow">
    <div class="public-card public-empty-state">
        <div class="w-14 h-14 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-envelope-slash text-slate-500 text-xl"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-900 mb-2">Unsubscribed</h1>
        <p class="text-slate-500 text-sm mb-6">You've been removed from county alerts. You can re-subscribe any time.</p>
        <a href="/alerts" class="public-btn public-btn--primary">Manage Alerts</a>
    </div>
</div>
{% endblock %}
