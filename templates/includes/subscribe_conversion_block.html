<section class="rounded-2xl border border-blue-200 bg-gradient-to-r from-blue-50 via-white to-slate-50 p-5 sm:p-6 shadow-sm">
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
        <div>
            <p class="text-[11px] font-black uppercase tracking-[0.18em] text-blue-600">Daily Email Alerts</p>
            <h2 class="mt-2 text-2xl font-black text-slate-900 leading-tight">Get Daily Montana Blotter Alerts</h2>
            <p class="mt-2 text-sm text-slate-600 max-w-2xl">One email each morning with major county updates, top incidents, and the weekly trend snapshot.</p>
            <div class="mt-3 flex flex-wrap items-center gap-2 text-[11px] font-bold uppercase tracking-[0.16em] text-slate-500">
                <span class="rounded-full bg-slate-100 px-2.5 py-1">Free</span>
                <span class="rounded-full bg-slate-100 px-2.5 py-1">No spam</span>
                <span class="rounded-full bg-slate-100 px-2.5 py-1">Unsubscribe anytime</span>
            </div>
        </div>

        <div class="w-full lg:w-auto">
            <form method="POST" action="/subscribe" class="w-full flex flex-col sm:flex-row gap-2 subscribe-form-track" data-subscribe-source="{{ source_tag or 'inline_cta' }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="source" value="{{ source_tag or 'inline_cta' }}">
                <input type="email"
                       name="email"
                       required
                       placeholder="you@example.com"
                       class="w-full sm:w-72 rounded-xl border border-slate-300 px-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <button type="submit"
                        class="subscribe-cta-track inline-flex items-center justify-center gap-2 rounded-xl bg-blue-600 px-5 py-3 text-xs font-black uppercase tracking-[0.12em] text-white transition hover:bg-blue-700"
                        data-subscribe-source="{{ source_tag or 'inline_cta' }}">
                    <i class="fas fa-envelope text-[11px]"></i>Get Daily Alerts
                </button>
            </form>
            <p class="mt-2 text-[11px] text-slate-500">
                By subscribing, you agree to our
                <a class="underline hover:text-slate-700" href="/terms-of-use">Terms of Use</a>
                and
                <a class="underline hover:text-slate-700" href="/privacy">Privacy Policy</a>.
            </p>
            <p class="mt-1 text-[11px] text-slate-500">
                Prefer one-time support?
                <a class="underline hover:text-slate-700" href="/donate?source={{ source_tag or 'inline_cta' }}_donate">Donate</a>.
            </p>
        </div>
    </div>
</section>
