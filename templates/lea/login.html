{% extends "public_page_base.html" %}
{% block title %}LEA Agency Login — Montana Blotter{% endblock %}
{% block content %}
<div style="max-width:400px;margin:4rem auto;padding:2rem;background:#fff;border:1px solid #ddd;border-radius:8px;">
    <h1 style="margin:0 0 0.5rem 0;text-align:center;">LEA Panel Login</h1>
    <p style="text-align:center;color:#666;margin:0 0 2rem 0;">Law Enforcement Agency Portal</p>

    {% if error %}
    <div style="background:#fadbd8;color:#c0392b;padding:0.75rem;border-radius:4px;margin-bottom:1rem;text-align:center;">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('lea_panel.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="margin-bottom:1rem;">
            <label style="display:block;margin-bottom:0.25rem;font-weight:600;font-size:0.9rem;">Username</label>
            <input type="text" name="username" required style="width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;">
        </div>
        <div style="margin-bottom:1.5rem;">
            <label style="display:block;margin-bottom:0.25rem;font-weight:600;font-size:0.9rem;">Password</label>
            <input type="password" name="password" required style="width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;">
        </div>
        <button type="submit" style="width:100%;padding:0.75rem;background:#1a5276;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:1rem;">Sign In</button>
    </form>
    <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:#999;">
        Authorized LEA personnel only. All access is audited.
    </p>
</div>
{% endblock %}
